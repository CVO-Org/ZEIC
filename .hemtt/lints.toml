[sqf]
# L-S33 flags coordinates like -3.1416 in the template data (addons/core/templates) as "use pi".
# HEMTT has no per-file ignore for SQF lints, so the lint is off project-wide.
# Re-enable once the templates have moved to config (#24).
reimplementing_command = false


[sqf.banned_commands]
options.banned = [
    #"spawn", # Scheduled should be avoided whenever possible
    #"execVM", # Script files should never be run directly, they should be functions
    #"remoteExec", # CBA events should be used for networking
]


lints.sqf.banned_commands = "Warning"


options.ignore = [
    "createSoundSource",
    "addPublicVariableEventHandler",
]


[sqf.command_case]
options.ignore = [
    "rankID",
    "groupID"
]


[base]
mission = "test.VR"
parameters = [
    "-noPauseAudio",
    "-noPause",
    "-window",
    "-debug"
]

[default]
extends = "base"
workshop = [
    "450814997",  # CBA_A3's Workshop ID
    "463939057",  # ACE3
    "3499977893", # Advanced Developer Tools
    "1779063631", # ZEN
]

[debugger]
extended = "default"
workshop = [
    "450814997",  # CBA_A3's Workshop ID
    "1585582292", # Arma Debug Engine
    "1645973522", # Intercept Minimal Dev
]

dlc = []
optionals = []

[ws]
dlc = ["ws"]
extends = "default"


[nomods]
extends = "base"

# Swaps the mission to Kavala, combine with another profile:
# hemtt launch default altis / hemtt launch nomods altis
[altis]
mission = "test.Altis"

# Performance tests in Kavala, no mods: hemtt launch perf
# Without -debug, which adds a stack trace to every engine warning in the RPT and slows things down.
# Doesn't extend base on purpose: extends would add -debug back.
[perf]
mission = "test.Altis"
parameters = [
    "-noPauseAudio",
    "-noPause",
    "-window"
]

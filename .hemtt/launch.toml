# Default test mission: Altis (Kavala), towns to test more modules in. The automated tests: the autotest profile
[base]
mission = "test.Altis"
parameters = [
    "-noPauseAudio",
    "-noPause",
    "-window",
    "-debug"
]

[default]
extends = "base"
workshop = [
    "450814997",  # CBA_A3's Workshop ID
    "463939057",  # ACE3
    "3499977893", # Advanced Developer Tools
    "1779063631", # ZEN
]

[debugger]
extended = "default"
workshop = [
    "450814997",  # CBA_A3's Workshop ID
    "1585582292", # Arma Debug Engine
    "1645973522", # Intercept Minimal Dev
]

dlc = []
optionals = []

[ws]
dlc = ["ws"]
extends = "default"


# CUP Terrains (Core + Maps): loads the CUP template addon, combine with a mission profile:
# hemtt launch default cup / hemtt launch default cup vr
[cup]
workshop = [
    "583496184",  # CUP Terrains - Core
    "583544987",  # CUP Terrains - Maps
]

[nomods]
extends = "base"

# Swaps the mission to VR (List Buildings, Save Building Scheme), combine with another profile:
# hemtt launch default vr / hemtt launch nomods vr
[vr]
mission = "test.VR"

# Unattended test run: switches the mission to autotest.Altis. Chain it last, after a modset:
#   hemtt launch default autotest
# tools\autotest.ps1 runs it and reports the result. The game starts the preview and quits by itself.
[autotest]
mission = "autotest.Altis"
